# Humble Steam Key Redeemer Configuration
# Copy this file to config.ini and modify as needed

[humble]
# Path to store Humble Bundle session cookies
cookie_file = .humblecookies

[steam]
# Path to store Steam session cookies
cookie_file = .steamcookies
# Steam rate limits (for reference, do not change)
rate_limit_keys_per_hour = 50
rate_limit_failed_per_hour = 10

[output]
# CSV files for tracking key redemption status
redeemed_file = redeemed.csv
owned_file = already_owned.csv
errored_file = errored.csv
# Prefix for export files (timestamp will be appended)
export_prefix = humble_export_
# Directory for key backups
backup_dir = backups

[settings]
# Minimum score for fuzzy matching (0-100)
# Higher = stricter matching, may miss some owned games
# Lower = looser matching, may skip some unowned games
fuzzy_match_threshold = 70
# Number of concurrent requests when fetching order details
max_concurrent_requests = 30
# Number of retry attempts for failed network requests
retry_attempts = 3
# Base delay between retries (doubles each retry)
retry_delay_seconds = 2
